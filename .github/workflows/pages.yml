name: Publish AHADALIFILMS to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read site files
        uses: actions/checkout@v4
      - name: Read GitHub Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare portable site addresses
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/prepare-pages.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
